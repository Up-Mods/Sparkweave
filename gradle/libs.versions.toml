[versions]
minecraft = "26.1.2"
java = "25"

# https://projects.neoforged.net/neoforged/moddevgradle
moddevgradle = "2.0.141"
# https://projects.neoforged.net/neoforged/neoform
neoform = "26.1.2-1"

# NeoForge
# https://projects.neoforged.net/neoforged/neoforge
neoforge = "26.1.2.76"
# https://projects.neoforged.net/neoforged/fancymodloader
# MUST match the version that neoforge uses! https://github.com/neoforged/NeoForge/blob/26.1.x/gradle.properties
fancymodloader = "11.0.13"

# Fabric
# https://fabricmc.net/develop
fabric_loom = "1.17.13" # https://maven.fabricmc.net/net/fabricmc/fabric-loom/net.fabricmc.fabric-loom.gradle.plugin/
fabric_loader = "0.19.3"
fabric_api = "0.154.0+26.1.2"

# https://maven.covers1624.net/service/rest/repository/browse/maven-hosted/net/covers1624/DevLogin/
devlogin = "0.1.0.5"
idea_ext = "1.4.1"

# Minecraft dependencies
jetbrains_annotations = "26.1.0"
jspecify = "1.0.0"
mixin = "0.17.3+mixin.0.8.7"
mixin_extras = "0.5.4"
asm = "9.9.1"
jna = "5.17.0"

# Other dependencies
appdirs = "1.5.0"
autoservice = "1.1.1"
junit = "6.1.0"

# Mods
# https://maven.blamejared.com/mezz/jei/jei-26.1.2-common/
jei = "29.6.2.38"
# https://modrinth.com/mod/modmenu/versions
modmenu = "18.0.0"
# https://beehive.sh/mod/resourcefulconfig/versions
resourcefulconfig = "4.0.1"

[libraries]
# NeoForge
neoforge_testframework = { module = "net.neoforged:testframework", version.ref = "neoforge" }
neoforge_mcdeps = { module = "net.neoforged:minecraft-dependencies", version.ref = "minecraft" }
neoforge_fancymodloader = { module = "net.neoforged.fancymodloader:loader", version.ref = "fancymodloader" }

# Fabric
fabric_loader = { module = "net.fabricmc:fabric-loader", version.ref = "fabric_loader" }
fabric_api = { module = "net.fabricmc.fabric-api:fabric-api", version.ref = "fabric_api" }
devlogin = { module = "net.covers1624:DevLogin", version.ref = "devlogin" }

# Minecraft dependencies
minecraft = { module = "com.mojang:minecraft", version.ref = "minecraft" }
mixin = { module = "net.fabricmc:sponge-mixin", version.ref = "mixin" }
mixin_extras = { module = "io.github.llamalad7:mixinextras-common", version.ref = "mixin_extras" }
asm = { module = "org.ow2.asm:asm", version.ref = "asm" }
asm_analysis = { module = "org.ow2.asm:asm-analysis", version.ref = "asm" }
asm_commons = { module = "org.ow2.asm:asm-commons", version.ref = "asm" }
asm_tree = { module = "org.ow2.asm:asm-tree", version.ref = "asm" }
asm_util = { module = "org.ow2.asm:asm-util", version.ref = "asm" }
jna = { module = "net.java.dev.jna:jna-platform", version.ref = "jna" }

# Other dependencies
appdirs = { module = "net.harawata:appdirs", version.ref = "appdirs" }
autoservice = { module = "com.google.auto.service:auto-service", version.ref = "autoservice" }
autoservice_annotations = { module = "com.google.auto.service:auto-service-annotations", version.ref = "autoservice" }
jetbrains_annotations = { module = "org.jetbrains:annotations", version.ref = "jetbrains_annotations" }
jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }
junit_api = { module = "org.junit.jupiter:junit-jupiter-api", version.ref = "junit" }
junit_launcher = { module = "org.junit.platform:junit-platform-launcher" }
junit_engine = { module = "org.junit.jupiter:junit-jupiter-engine", version.ref = "junit" }
slf4j_api = { module = "org.slf4j:slf4j-api" }

# Mods
jei_api = { module = "mezz.jei:jei-26.1.2-common-api", version.ref = "jei" }
jei_fabric = { module = "mezz.jei:jei-26.1.2-fabric", version.ref = "jei" }
jei_fabric_api = { module = "mezz.jei:jei-26.1.2-fabric-api", version.ref = "jei" }
jei_neoforge = { module = "mezz.jei:jei-26.1.2-neoforge", version.ref = "jei" }
jei_neoforge_api = { module = "mezz.jei:jei-26.1.2-neoforge-api", version.ref = "jei" }

modmenu_fabric = { module = "com.terraformersmc:modmenu", version.ref = "modmenu" }

resourcefulconfig = { module = "com.teamresourceful.resourcefulconfig:resourcefulconfig-common-1.21", version.ref = "resourcefulconfig" }
resourcefulconfig_fabric = { module = "com.teamresourceful.resourcefulconfig:resourcefulconfig-fabric-1.21", version.ref = "resourcefulconfig" }
resourcefulconfig_neoforge = { module = "com.teamresourceful.resourcefulconfig:resourcefulconfig-neoforge-1.21", version.ref = "resourcefulconfig" }

[bundles]
mixin = ["mixin", "mixin_extras", "asm", "asm_analysis", "asm_commons", "asm_tree", "asm_util"]

[plugins]
moddevgradle = { id = "net.neoforged.moddev", version.ref = "moddevgradle" }
fabric_loom = { id = "net.fabricmc.fabric-loom", version.ref = "fabric_loom" }
idea_ext = { id = "org.jetbrains.gradle.plugin.idea-ext", version.ref = "idea_ext" }
