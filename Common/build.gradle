plugins {
	alias libs.plugins.moddevgradle
}

neoForge.neoFormVersion = libs.versions.neoform.get()

dependencies {
	compileOnly libs.bundles.mixin
	compileOnly libs.jetbrains.annotations

	compileOnly libs.appdirs

//	compileOnly libs.resourcefulconfig
	compileOnly variantOf(libs.emi) {
		classifier 'api'
	}

	testmodImplementation sourceSets.main.output

	testCompileOnly libs.junit.api
	testCompileOnly libs.neoforge.testframework
}

neoForge {
	parchment {
		minecraftVersion = libs.versions.parchment.minecraft.get()
		mappingsVersion = libs.versions.parchment.mappings.get()
	}

	accessTransformers {
		def atFile = file("src/main/resources/META-INF/accesstransformer.cfg")
		from atFile
		publish atFile
	}
	validateAccessTransformers.set(true)

	interfaceInjectionData {
		def interfacesFile = file("src/main/resources/META-INF/interfaces.json")
		from(interfacesFile)
		publish interfacesFile
	}

	addModdingDependenciesTo sourceSets.test
}

configurations {
	testmod {
		canBeResolved = false
		canBeConsumed = true
	}
}

artifacts {
	testmod(sourceSets.testmod.output.classesDirs.singleFile) {
		builtBy testmodClasses
	}
}
