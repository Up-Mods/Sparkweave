plugins {
	alias libs.plugins.moddevgradle
}

// need this before dependencies because it configures the plugin and creates additionalRuntimeClasspath configuration
neoForge.version = libs.versions.neoforge.get()

configurations {
	runtimeClasspath.extendsFrom localRuntime
}

dependencies {
	compileOnly project(":Sparkweave-Common")
	interfaceInjectionData project(":Sparkweave-Common")
	accessTransformers project(":Sparkweave-Common")
	compileOnly libs.autoservice.annotations
	annotationProcessor libs.autoservice

	testmodImplementation sourceSets.main.output
	testmodCompileOnly(project(":Sparkweave-Common")) {
		targetConfiguration = "testmod"
	}
	testmodCompileOnly libs.autoservice.annotations
	testmodAnnotationProcessor libs.autoservice

//	implementation libs.resourcefulconfig.neoforge

	implementation libs.appdirs
	additionalRuntimeClasspath libs.appdirs
	jarJar(libs.appdirs) {
		transitive = false
	}

	compileOnly variantOf(libs.emi.neoforge) {
		classifier 'api'
	}
	localRuntime libs.emi.neoforge

	testImplementation libs.junit.api
	testImplementation libs.neoforge.testframework
	testRuntimeOnly libs.junit.launcher
	testRuntimeOnly libs.junit.engine
}

test {
	useJUnitPlatform()
}

neoForge {
	parchment {
		minecraftVersion = libs.versions.parchment.minecraft.get()
		mappingsVersion = libs.versions.parchment.mappings.get()
	}

	mods {
		// define mod <-> source bindings
		// these are used to tell the game which sources are for which mod
		// mostly optional in a single mod project
		// but multi mod projects should define one per mod
		"${mod_id}" {
			sourceSet(sourceSets.main)
			sourceSet(project(":Sparkweave-Common").sourceSets.main)
		}

		"${project.mod_id}_testmod" {
			sourceSet(sourceSets.testmod)
			sourceSet(project(":Sparkweave-Common").sourceSets.testmod)
		}
	}

	unitTest {
		enable()

		testedMod = mods."${mod_id}"
		loadedMods.set([mods."${mod_id}"])
	}

	runs {
		configureEach {
			logLevel = org.slf4j.event.Level.DEBUG
			systemProperty 'forge.logging.markers', 'REGISTRIES'
			systemProperty 'sparkweave.debug', 'true'
		}

		client {
			client()
			devLogin = true
			gameDirectory = file('run')
			systemProperty 'neoforge.enabledGameTestNamespaces', "${mod_id}"

			sourceSet = sourceSets.main
			loadedMods.set([mods."${mod_id}"])
		}

		server {
			server()
			gameDirectory = file('run')
			systemProperty 'neoforge.enabledGameTestNamespaces', "${mod_id}"

			sourceSet = sourceSets.main
			loadedMods.set([mods."${mod_id}"])

			programArguments.add('--nogui')
		}

		testmodClient {
			client()
			devLogin = true
			gameDirectory = file('run/testmod')
			systemProperty 'neoforge.enabledGameTestNamespaces', "${mod_id}_testmod"

			sourceSet = sourceSets.testmod
			loadedMods.set([mods."${mod_id}", mods."${mod_id}_testmod"])
		}

		data {
			data()
			gameDirectory = project.file('run')
			programArguments.addAll('--mod', "${mod_id}", '--mod', "${mod_id}_testmod", '--all', '--flat', '--output', file('src/testmod/generated').absolutePath, '--existing', file('src/testmod/resources').absolutePath)

			sourceSet = sourceSets.testmod
			loadedMods.set([mods."${mod_id}", mods."${mod_id}_testmod"])
		}
	}
}

sourceSets.testmod.resources { srcDir "src/testmod/generated" }

tasks.named("compileJava", JavaCompile) {
	source project(":Sparkweave-Common").sourceSets.main.allJava
}

tasks.named("compileTestJava", JavaCompile) {
	source project(":Sparkweave-Common").sourceSets.test.allJava
}

tasks.named("compileTestmodJava", JavaCompile) {
	source project(":Sparkweave-Common").sourceSets.testmod.allJava
}

tasks.named("javadoc", Javadoc) {
	source project(":Sparkweave-Common").sourceSets.main.allJava
}

tasks.named("sourcesJar", Jar) {
	from project(":Sparkweave-Common").sourceSets.main.allSource
}

processResources {
	from project(":Sparkweave-Common").sourceSets.main.resources
}

processTestResources {
	from project(":Sparkweave-Common").sourceSets.test.resources
}

processTestmodResources {
	from project(":Sparkweave-Common").sourceSets.testmod.resources
}
